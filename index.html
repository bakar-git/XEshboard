<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- <meta http-equiv="refresh" content="1"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="asset/lib/bs5/bootstrap.min.css">
    <link rel="stylesheet" href="asset/css/style.css">
    <title>XEshboard</title>
</head>

<body>
    <div class="d-flex" id="body-wrapper" data-layout="normal">
        <!-- LEFT BAR START -->
        <section id="left-bar" class="bg-dark-n1">
            <div id="left-bar-in" class="d-flex flex-column h-100">
                <!-- Branding -->
                <div id="lb-brand" class="py-1 bg-dark-n2 text-center text-white fw-bold m-0">
                    <span>XEshboard</span>
                </div>
                <!-- Search Bar -->
                <div id="lb-search-bar"
                    class="d-flex mx-2 my-2 border border-2 rounded-3 border-dark-n2">
                    <div class="w-80">
                        <input type="text"
                            class="form-control shadow-none bg-dark-n1 border-0 text-white w-100 h-100 rounded-0"
                            placeholder="Search">
                    </div>
                    <div class="w-20">
                        <button class="btn btn-outline-primary w-100 h-100 border-0 shadow-none rounded-0 rounded-end text-white">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <!-- Left Bar Items -->
                <div id="lb-items">
                    <!-- Simple Element (active) -->
                    <div class="d-flex">
                        <span
                            class="active btn btn-outline-primary d-flex align-items-center w-100 mx-2 my-1 py-2 text-white border-0 text-start">
                            <i class="fas fa-tachometer-alt lb-item-icon"></i>
                            <span class="name ms-2">Dashboard</span>
                        </span>
                    </div>

                    <!-- Simple Element (active) -->
                    <div class="d-flex">
                        <span
                            class="btn btn-outline-primary d-flex align-items-center w-100 mx-2 my-1 py-2 text-white border-0 text-start">
                            <i class="fas fa-user lb-item-icon"></i>
                            <span class="name ms-2">User</span>
                        </span>
                    </div>
                    <!-- Simple Element (with badge) -->
                    <div class="d-flex">
                        <span
                            class="btn btn-outline-primary d-flex align-items-center w-100 mx-2 my-1 py-2 text-white border-0 text-start">
                            <i class="fas fa-cart-shopping lb-item-icon"></i>
                            <span class="name ms-2">Product</span>
                            <span class="badge bg-danger ms-auto">100</span>
                        </span>
                    </div>
                    
                </div>

            </div>
        </section>
        <!-- LEFT BAR END -->

        <!-- MIDDLE SECTION START -->
        <section id="middleSection" class="d-flex w-100 h-100">
            <!-- TOP BAR START -->
            <section id="top-bar" class="bg-dark-n2 w-100 d-flex text-white">
                <!-- Left Bar Close Toggle -->
                <div class="btn btn-outline-primary border-0 rounded-0 px-3 d-flex align-items-center text-white">
                    <i class="fas fa-bars fa-lg"></i>
                </div>
                <!-- Message Dropdown -->
                <div class="ms-auto btn btn-outline-primary border-0 rounded-0 px-3 d-flex align-items-center text-white">
                    <i class="fas fa-envelope fa-lg position-relative">
                        <span class="indicator"></span>
                    </i>
                </div>
                <!-- Notifications Dropdown -->
                <div class="btn btn-outline-primary border-0 rounded-0 px-3 d-flex align-items-center text-white">
                    <i class="fas fa-bell fa-lg position-relative">
                        <span class="indicator"></span>
                    </i>
                </div>
                <!-- Task Dropdown -->
                <div class="btn btn-outline-primary border-0 rounded-0 px-3 d-flex align-items-center text-white">
                    <i class="fas fa-tasks-alt fa-lg position-relative">
                        <span class="indicator"></span>
                    </i>
                </div>
                <!-- Profile -->
                <div class="btn btn-outline-primary border-0 rounded-0 px-2 d-flex align-items-center text-white">
                    <img src="https://randomuser.me/api/portraits/women/54.jpg" class="rounded-circle img-fluid h-100 border border-light border-2">
                    <span class="ms-1">Valeria Dokanovic</span>
                </div>
            </section>
            <!-- TOP BAR END -->

            <!-- CONTENT START -->
            <section id="content">

            </section>
            <!-- CONTENT END -->


        </section>
        <!-- MIDDLE SECTION START -->
    </div>



    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script> -->
    <script src="asset/lib/bs5/bootstrap.bundle.min.js"></script>
    <script src="asset/js/main.js"></script>


    <!-- Adding icons and fonts at end -->

    <link rel="stylesheet" href="asset/lib/fa6/css/all.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&amp;display=fallback">
</body>

</html>
